site_name: Coriolis Documentation
site_description: Documentation for the Coriolis workload migration product and Kubernetes operator.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - 📋 Overview: index.md
  - 📋 Basic Concepts:
      - 📋 Architecture: architecture.md
      - 📋 Migration Flow: migration-flow.md
  - 📋 Quick Start:
      - 📄 Lab Environment: operator-lab-environment.md
      - 📋 Deploy an Appliance: deploy-appliance.md
      - "📋 Phase 1: Headless Migration": headless-migration.md
      - "📋 Phase 2: Web UI Migration": web-ui-migration.md
      - 📋 Remove Appliance: remove-appliance.md
  - ⏳ Technical Debt And Limitations: technical-debt.md
  - ⏳ OpenStack Context: openstack-provider.md
  - 📄 Terminology: terminology.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - codehilite
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: true
      title: On this page
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
