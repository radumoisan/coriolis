# Argo CD Application example deploying the coriolis-operator chart from OCI.
#
# This example intentionally uses chart defaults. An OCI-source Application
# cannot reference the root docs asset via helm.valueFiles; if overrides are
# needed, inline equivalent keys under spec.source.helm.values. The separate
# coriolis-operator-values.example.yaml asset is intended as Helm CLI
# reference.
#
# The wildcard targetRevision below is the Argo CD channel selector, not a
# manually pinned release version: CIXpress/CI owns chart, application, and
# image versions and publishes new chart versions to the OCI registry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coriolis
  namespace: argocd
spec:
  project: coriolis
  source:
    repoURL: cr.virtomat.io/virtomat
    chart: coriolis/helm/coriolis-operator
    targetRevision: 0.*.*
  destination:
    server: https://kubernetes.default.svc
    namespace: coriolis
  syncPolicy:
    # Automated sync is enabled, but prune and selfHeal are intentionally
    # left disabled (default false) to match the live safety posture.
    automated: {}
    syncOptions:
      - CreateNamespace=true
