transfer:
  # Change this before a later independent rerun after an existing transfer or deployment remains.
  notes: "headless-real-migration"
  # Required Coriolis live-migration scenario.
  scenario: "live_migration"
  # Validated source endpoint UUID.
  origin_endpoint_id: "593a32db-5eeb-442d-83a1-2ec9f8045865"
  # Validated destination endpoint UUID.
  destination_endpoint_id: "732224c5-a451-4e09-a38f-fb70bca924c6"
  # Validated source fixture instance UUID.
  instances:
    - "deb91e29-7901-466c-b799-90d439145ab6"
  source_environment:
    # Use the verified Swift backup export path.
    replica_export_mechanism: "swift_backups"
  destination_environment:
    migr_image_map:
      # Validated Linux image for the temporary migration worker.
      linux: "b480e10c-edc9-400a-8b70-49883cb68392"
    # Provider network option validated for the temporary migration worker.
    migr_network: "coriolis-destination-net"
    # Validated private flavor for the temporary migration worker.
    migr_flavor_name: "coriolis-worker"
    # Boot the worker image directly on the flavor root disk.
    migr_worker_boot_from_volume: false
    # Give the temporary worker a floating IP.
    migr_worker_use_fip: true
    # Validated floating-IP pool for the temporary worker.
    migr_fip_pool_name: "c5815350-3a4c-4a6a-a567-db9f0d6e5a19/08e4c993-ad01-49fe-ada4-050f7339984c"
    # Validated security group for the temporary migration worker.
    security_groups:
      - "coriolis-worker-sg"
    # Validated keypair for the temporary migration worker.
    keypair_name: "coriolis-worker-key"
    # Give the deployed destination instance a floating IP.
    use_floating_ip: true
    # Validated floating-IP pool for the deployed destination instance.
    floating_ip_pool: "c5815350-3a4c-4a6a-a567-db9f0d6e5a19/08e4c993-ad01-49fe-ada4-050f7339984c"
    # Do not preserve source fixed IPs on the destination.
    preserve_fixed_ips: false
  network_map:
    # Map the validated source NIC network to the destination network ID.
    "coriolis-source-net": "8f3f9804-e2f0-48ec-a9a9-d78a98234a69"
  storage_mappings:
    # Let the destination choose disk placement.
    default: "__DEFAULT__"
  # Clone disks for this proof-of-concept path.
  clone_disks: true
  # Use only for the known-compatible disposable fixture.
  skip_os_morphing: true
execution:
  # Shut down the source instance after migration.
  shutdown_instances: true
  # Automatically deploy the migrated destination instance.
  auto_deploy: true
